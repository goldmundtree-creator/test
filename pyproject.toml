[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "Obsidian vault용 MCP 서버 - Claude가 vault 파일에 직접 접근"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
