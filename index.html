<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>테트리스</h1>
        <div class="game-container">
            <div class="game-info">
                <div class="info-box">
                    <h2>점수</h2>
                    <p id="score">0</p>
                </div>
                <div class="info-box">
                    <h2>레벨</h2>
                    <p id="level">1</p>
                </div>
                <div class="info-box">
                    <h2>라인</h2>
                    <p id="lines">0</p>
                </div>
                <div class="next-piece">
                    <h2>다음 블록</h2>
                    <canvas id="next-canvas" width="120" height="120"></canvas>
                </div>
            </div>
            <div class="game-board">
                <canvas id="game-canvas" width="300" height="600"></canvas>
                <div id="game-over" class="game-over hidden">
                    <h2>게임 오버!</h2>
                    <p>최종 점수: <span id="final-score">0</span></p>
                    <button id="restart-btn">다시 시작</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <h3>조작법</h3>
            <ul>
                <li><strong>←/→</strong>: 좌우 이동</li>
                <li><strong>↓</strong>: 빠르게 떨어뜨리기</li>
                <li><strong>↑</strong>: 회전</li>
                <li><strong>스페이스바</strong>: 한번에 떨어뜨리기</li>
                <li><strong>P</strong>: 일시정지</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
